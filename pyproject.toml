[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sprintwarden"
dynamic = ["version"]
description = "A test ratchet and sprint tracker for AI coding agents: your agent can't silently delete, skip or break your old tests anymore, on any stack."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "sprintwarden contributors" }]
keywords = [
    "ai-agents", "claude-code", "testing", "junit", "regression", "ratchet",
    "sprints", "git-hooks", "ci", "agents-md",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
# Runtime is standard library only. Keep it that way (docs/DECISIONS.md, D-001).
dependencies = []

[project.urls]
Homepage = "https://github.com/sprintwarden/sprintwarden"
Documentation = "https://github.com/sprintwarden/sprintwarden#readme"
Issues = "https://github.com/sprintwarden/sprintwarden/issues"
Changelog = "https://github.com/sprintwarden/sprintwarden/blob/main/CHANGELOG.md"

[project.scripts]
sprint = "sprintwarden.cli:main"
sprintwarden = "sprintwarden.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.version]
path = "sprintwarden/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sprintwarden"]

[tool.hatch.build.targets.sdist]
include = [
    "sprintwarden/", "tests/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/**/node_modules", ".sprint"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PIE", "RUF100"]
ignore = ["SIM105", "SIM108", "SIM117"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: integration tests that spawn processes and git repos",
    "browser: needs Playwright (skipped when unavailable)",
]
