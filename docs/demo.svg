near infinite}@keyframes k16{0%,34.57%{opacity:0}35.34%,97%{opacity:1}100%{opacity:0}}.l16{animation:k16 19.4s linear infinite}@keyframes k17{0%,36.73%{opacity:0}37.50%,97%{opacity:1}100%{opacity:0}}.l17{animation:k17 19.4s linear infinite}@keyframes k18{0%,38.89%{opacity:0}39.66%,97%{opacity:1}100%{opacity:0}}.l18{animation:k18 19.4s linear infinite}@keyframes k19{0%,41.05%{opacity:0}41.82%,97%{opacity:1}100%{opacity:0}}.l19{animation:k19 19.4s linear infinite}@keyframes k20{0%,43.21%{opacity:0}43.98%,97%{opacity:1}100%{opacity:0}}.l20{animation:k20 19.4s linear infinite}@keyframes k21{0%,45.37%{opacity:0}46.14%,97%{opacity:1}100%{opacity:0}}.l21{animation:k21 19.4s linear infinite}@keyframes k22{0%,47.53%{opacity:0}48.30%,97%{opacity:1}100%{opacity:0}}.l22{animation:k22 19.4s linear infinite}@keyframes k23{0%,49.69%{opacity:0}50.46%,97%{opacity:1}100%{opacity:0}}.l23{animation:k23 19.4s linear infinite}@keyframes k24{0%,51.85%{opacity:0}52.62%,97%{opacity:1}100%{opacity:0}}.l24{animation:k24 19.4s linear infinite}@keyframes k25{0%,54.01%{opacity:0}54.78%,97%{opacity:1}100%{opacity:0}}.l25{animation:k25 19.4s linear infinite}@keyframes k26{0%,56.17%{opacity:0}56.94%,97%{opacity:1}100%{opacity:0}}.l26{animation:k26 19.4s linear infinite}@keyframes k27{0%,58.33%{opacity:0}59.10%,97%{opacity:1}100%{opacity:0}}.l27{animation:k27 19.4s linear infinite}@keyframes k28{0%,60.49%{opacity:0}61.27%,97%{opacity:1}100%{opacity:0}}.l28{animation:k28 19.4s linear infinite}@keyframes k29{0%,62.65%{opacity:0}63.43%,97%{opacity:1}100%{opacity:0}}.l29{animation:k29 19.4s linear infinite}@keyframes k30{0%,64.81%{opacity:0}65.59%,97%{opacity:1}100%{opacity:0}}.l30{animation:k30 19.4s linear infinite}@keyframes k31{0%,66.98%{opacity:0}67.75%,97%{opacity:1}100%{opacity:0}}.l31{animation:k31 19.4s linear infinite}</style>
<rect width="100%" height="100%" rx="8" fill="#0d1117"/>
<circle cx="20" cy="18" r="6" fill="#ff5f56"/><circle cx="40" cy="18" r="6" fill="#ffbd2e"/><circle cx="60" cy="18" r="6" fill="#27c93f"/>
<text class="c" x="478" y="22" text-anchor="middle">sprintwarden demo</text>
<text class="c l0" x="18" y="58"># Protect every test that exists today (2 minutes, any stack):</text>
<text class="p l1" x="18" y="77">$ sprint init --ratchet-only</text>
<text class="ok l2" x="18" y="96">✓ created .sprint/config.toml (stack pytest: pytest --junitxml=.sprint/out/junit.xml)</text>
<text class="ok l3" x="18" y="115">✓ baseline written: 4 tests must keep existing and passing</text>
<text class="t l4" x="18" y="134"></text>
<text class="c l5" x="18" y="153"># An agent refactors to_cents() with float maths and breaks rounding...</text>
<text class="p l6" x="18" y="172">$ sprint gate</text>
<text class="t l7" x="18" y="191">sprintwarden gate — invoices</text>
<text class="ok l8" x="18" y="210">✓ runner     4 tests parsed from 1 file (0.1s)</text>
<text class="bad l9" x="18" y="229">✗ failures   1 failing (1 regression)</text>
<text class="bad l10" x="18" y="248">     S01    tests.test_invoice.test_S01_rounds_half_up  ← REGRESSION from sprint S01</text>
<text class="t l11" x="18" y="267">             AssertionError: assert 100 == 101 + where 100 = to_cents(&#x27;1.005&#x27;)</text>
<text class="ok l12" x="18" y="286">✓ missing    no tests missing vs baseline</text>
<text class="ok l13" x="18" y="305">✓ skips      no new skips</text>
<text class="ok l14" x="18" y="324">✓ ratchet    4 ≥ 4</text>
<text class="bad b l15" x="18" y="343">GATE: FAIL</text>
<text class="t l16" x="18" y="362"></text>
<text class="c l17" x="18" y="381"># ...then &#x27;fixes&#x27; the red build by deleting the old test:</text>
<text class="p l18" x="18" y="400">$ pytest -q</text>
<text class="t l19" x="18" y="419">3 passed in 0.00s</text>
<text class="p l20" x="18" y="438">$ sprint gate</text>
<text class="t l21" x="18" y="457">sprintwarden gate — invoices</text>
<text class="ok l22" x="18" y="476">✓ runner     3 tests parsed from 1 file (0.1s)</text>
<text class="ok l23" x="18" y="495">✓ failures   no failing tests</text>
<text class="bad l24" x="18" y="514">✗ missing    1 test missing vs baseline</text>
<text class="warn l25" x="18" y="533">     S01    tests.test_invoice.test_S01_rounds_half_up  ← deleted or renamed? use `sprint accept-removal` (human only)</text>
<text class="ok l26" x="18" y="552">✓ skips      no new skips</text>
<text class="bad l27" x="18" y="571">✗ ratchet    3 &lt; 4: the suite shrank</text>
<text class="t l28" x="18" y="590">     tests only go up; restore the tests or have a human run `sprint accept-removal`</text>
<text class="bad b l29" x="18" y="609">GATE: FAIL</text>
<text class="t l30" x="18" y="628"></text>
<text class="c l31" x="18" y="647"># Only a human can accept that: sprint accept-removal &lt;test&gt; --reason &#x27;...&#x27;</text>
</svg>
