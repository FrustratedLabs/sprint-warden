<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sprintwarden</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="sprintwarden, all projects"><svg class="brand-mark" viewBox="0 0 120 120" aria-hidden="true" focusable="false"><path fill="currentColor" d="M24.5 22A5.5 5.5 0 0 1 35.5 22V66.07L24.5 72.05ZM24.5 92.54L35.5 86.56V98A5.5 5.5 0 0 1 24.5 98ZM44.5 22A5.5 5.5 0 0 1 55.5 22V55.2L44.5 61.18ZM44.5 81.67L55.5 75.69V98A5.5 5.5 0 0 1 44.5 98ZM64.5 22A5.5 5.5 0 0 1 75.5 22V44.33L64.5 50.31ZM64.5 70.8L75.5 64.82V98A5.5 5.5 0 0 1 64.5 98ZM84.5 22A5.5 5.5 0 0 1 95.5 22V33.46L84.5 39.44ZM84.5 59.93L95.5 53.95V98A5.5 5.5 0 0 1 84.5 98Z"/><path fill="#FF4433" d="M16.63 92.83L108.63 42.83A5.5 5.5 0 0 0 103.37 33.17L11.37 83.17A5.5 5.5 0 0 0 16.63 92.83Z"/></svg><span>sprintwarden</span></a>
  <nav class="primary" id="primary" aria-label="Main">
    <a href="#/" data-nav="projects"><span data-icon="layout-grid"></span>Projects</a>
    <a href="#/board" data-nav="board"><span data-icon="square-kanban"></span>Board</a>
  </nav>
  <div class="spacer"></div>
  <button type="button" class="icon-btn theme" id="theme" aria-label="Theme: match system. Click for light" title="Theme: match system"><span data-icon="sun-moon"></span></button>
  <label class="switch" title="Reload the data every 15 seconds">
    <input type="checkbox" id="autorefresh" checked>
    <span class="track" aria-hidden="true"></span>
    <span>Auto-refresh</span>
  </label>
  <span class="updated" id="updated" aria-live="polite"></span>
</header>
<main id="app" tabindex="-1"><p class="muted">Loading…</p></main>
<footer class="foot">
  <span>Local and read-only. Everything here comes from each project's <code>.sprint/</code> folder.</span>
  <span id="version"></span>
  <span>Icons: Lucide (ISC)</span>
</footer>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
